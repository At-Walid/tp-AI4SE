# Configuration de mutmut 2.5.1 (make mutmut). L'outil principal du TP3 est tools/mini_mutate.py.
# mutmut 2 modifie remise.py en place pendant l'exécution puis le restaure :
# ne l'interrompez pas (Ctrl+C) ; en cas de doute, vérifiez remise.py avec git diff.
[mutmut]
paths_to_mutate = tp/tp1_generation/remise.py
tests_dir = tp/tp3_mutation/
runner = python -m pytest -x -q -p no:cacheprovider tp/tp2_critique/test_reecrits.py tp/tp3_mutation
